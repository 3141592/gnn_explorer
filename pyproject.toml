[project]
name = "gnn_explorer"
version = "0.1.0"
description = "Experiments with graph neural networks"
requires-python = ">=3.10"

dependencies = [
    "torch",
    "torch_geometric",
    "networkx",
    "matplotlib",
    "pandas",
    "scikit-learn"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"